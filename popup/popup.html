<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">◉ Argus Lens</span><span id="status" class="pill">On</span></header>
  <p class="sub">Prompt guard for ChatGPT, Claude & Gemini. 100% local — nothing leaves your browser.</p>
  <label>Policy profile
    <select id="profile">
      <option value="strict">Strict — block secrets + injection, redact PII</option>
      <option value="standard">Standard — block secrets, redact PII, flag injection</option>
      <option value="permissive">Permissive — block secrets only, flag rest</option>
    </select>
  </label>
  <div id="last" class="card">No scans yet on this tab. Type a prompt containing an email or a key to test it.</div>
  <h3>Recent audit (redacted)</h3>
  <ul id="audit"></ul>
  <div class="row">
    <button id="options">Options & blocklist</button>
    <button id="clear">Clear audit</button>
    <button id="toggle">Turn off</button>
  </div>
  <footer>Browser companion to <a href="https://github.com/karmendra8386/argus" target="_blank">Argus</a> · v0.1.0</footer>
  <script src="popup.js"></script>
</body></html>
